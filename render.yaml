services:
  - type: web
    name: qaty-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --worker-class eventlet --workers 1 --bind 0.0.0.0:5000
    Pre-DeployCommand: export DATABASE_URL=postgresql://user:password@localhost/qaty
export JWT_SECRET_KEY=your-secret-key
python app.py
StartCommand: python android_app.py
      - key: DATABASE_URL
        fromDatabase:
          name: qaty-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.9.0

databases:
  - name: qaty-db
    databaseName: qaty
    user: qaty_user
    plan: free
