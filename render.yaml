services:
  # خدمة API الأساسية
  - type: web
    name: qat-api
    env: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python database_init.py
    startCommand: gunicorn run_server:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: RENDER
        value: true
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        value: rnd_DUomOIFZV3LldOVdqsn5eQ1TmDTj
      - key: DATABASE_URL
        fromDatabase:
          name: qat-database
          property: connectionString
      - key: SUPPORT_PHONE
        value: "771831482"
      - key: SUPPORT_EMAIL
        value: support@qat-app.com
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # قاعدة البيانات
  - type: postgres
    name: qat-database
    region: frankfurt
    plan: free
    ipAllowList: []

databases:
  - name: qat-database
    region: frankfurt
    plan: free
