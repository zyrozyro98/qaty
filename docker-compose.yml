version: '3.8'

services:
  # قاعدة البيانات
  db:
    image: postgres:15
    container_name: qat_db
    restart: always
    environment:
      POSTGRES_DB: qat_app
      POSTGRES_USER: qat_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qat_password123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - qat_network

  # Redis للتخزين المؤقت
  redis:
    image: redis:7-alpine
    container_name: qat_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - qat_network

  # تطبيق Flask API
  api:
    build: .
    container_name: qat_api
    restart: always
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://qat_user:${DB_PASSWORD:-qat_password123}@db/qat_app
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-rnd_DUomOIFZV3LldOVdqsn5eQ1TmDTj}
      - API_KEY=${API_KEY:-rnd_DUomOIFZV3LldOVdqsn5eQ1TmDTj}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./firebase-credentials.json:/app/firebase-credentials.json
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
    networks:
      - qat_network
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 --threads 2 --timeout 120 run_server:app

  # Nginx كموازن حمل
  nginx:
    image: nginx:alpine
    container_name: qat_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./uploads:/var/www/uploads
    depends_on:
      - api
    networks:
      - qat_network

  # pgAdmin لإدارة قاعدة البيانات
  pgadmin:
    image: dpage/pgadmin4
    container_name: qat_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@qat-app.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - qat_network

networks:
  qat_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
