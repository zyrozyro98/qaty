[tool.poetry]
name = "qat-app"
version = "1.0.0"
description = "تطبيق بيع وتوصيل القات"
authors = ["Your Name <your@email.com>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.9"
Flask = "2.2.5"
Flask-CORS = "4.0.0"
Flask-SocketIO = "5.3.4"
Flask-JWT-Extended = "4.5.2"
python-socketio = "5.9.0"
python-engineio = "4.7.0"
Pillow = "10.2.0"
requests = "2.31.0"
gunicorn = "21.2.0"
greenlet = "2.0.2"
Werkzeug = "2.3.7"
six = "1.16.0"
certifi = "2023.7.22"
PyJWT = "2.10.1"
bidict = "0.23.1"
itsdangerous = "2.1.2"
Jinja2 = "3.1.2"
click = "8.1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = "^22.0"
flake8 = "^6.0"
pytest-cov = "^4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
